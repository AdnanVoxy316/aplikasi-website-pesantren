<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Tebak Angka</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1e1e2e;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #313244;
      padding: 2rem;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,.5);
      max-width: 400px;
      width: 90%;
    }
    h1 { margin-top: 0; font-size: 1.6rem; }
    input {
      padding: .6rem;
      font-size: 1.2rem;
      width: 100px;
      text-align: center;
      border: none;
      border-radius: 8px;
      outline: none;
    }
    button {
      margin: .6rem .3rem 0;
      padding: .6rem 1.2rem;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #89b4fa;
      color: #1e1e2e;
      font-weight: 600;
    }
    button:hover { background: #a6c8ff; }
    #pesan { margin-top: 1rem; font-size: 1.1rem; min-height: 1.5em; }
    #skor { margin-top: .5rem; color: #a6adc8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Tebak Angka 1-100</h1>
    <p>Pilih angka dan tekan tebak.</p>
    <input type="number" id="tebakan" min="1" max="100" placeholder="1-100">
    <br>
    <button onclick="tebak()">Tebak</button>
    <button onclick="reset()">Ulangi</button>
    <p id="pesan"></p>
    <p id="skor">Skor: 0</p>
  </div>

  <script>
    let target = Math.floor(Math.random() * 100) + 1;
    let skor = 0;

    function tebak() {
      const nilai = parseInt(document.getElementById('tebakan').value);
      const pesan = document.getElementById('pesan');
      if (isNaN(nilai) || nilai < 1 || nilai > 100) {
        pesan.textContent = 'Masukkan angka 1-100!';
        return;
      }
      skor++;
      if (nilai === target) {
        pesan.textContent = 'Benar! Kamu menang!';
        document.getElementById('skor').textContent = 'Skor akhir: ' + skor;
      } else if (nilai < target) {
        pesan.textContent = 'Terlalu kecil, coba lagi.';
      } else {
        pesan.textContent = 'Terlalu besar, coba lagi.';
      }
    }

    function reset() {
      target = Math.floor(Math.random() * 100) + 1;
      skor = 0;
      document.getElementById('tebakan').value = '';
      document.getElementById('pesan').textContent = '';
      document.getElementById('skor').textContent = 'Skor: 0';
    }
  </script>
</body>
</html>
